<text x="915.0" y="444" class="c" text-anchor="middle">跳 ✓</text>
<text x="20" y="490" class="s">只在退出那一次猜错。计数器从 3 降到 2 还是猜“跳”，下一次进循环不会跟着错。</text>
</svg>
