<text x="425.0" y="404" class="c" text-anchor="middle">3</text>
<text x="425.0" y="444" class="c" text-anchor="middle">跳 ✓</text>
<rect x="463" y="340" width="64" height="34" rx="4" fill="#ddf4ff" stroke="#54aeff"/>
<text x="495.0" y="362" class="c" text-anchor="middle">跳</text>
<text x="495.0" y="404" class="c" text-anchor="middle">3</text>
<text x="495.0" y="444" class="c" text-anchor="middle">跳 ✓</text>
<rect x="533" y="340" width="64" height="34" rx="4" fill="#ddf4ff" stroke="#54aeff"/>
<text x="565.0" y="362" class="c" text-anchor="middle">跳</text>
<text x="565.0" y="404" class="c" text-anchor="middle">3</text>
<text x="565.0" y="444" class="c" text-anchor="middle">跳 ✓</text>
<rect x="603" y="340" width="64" height="34" rx="4" fill="#f6f8fa" stroke="#afb8c1"/>
